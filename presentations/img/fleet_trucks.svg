<text x="865.0" y="201.7" text-anchor="middle" font-size="20" font-weight="700" fill="#ea580c">web portal</text>
<line x1="940.0" y1="195.0" x2="985.0" y2="95.0" stroke="#ea580c" stroke-width="2" marker-end="url(#a-c1)"/>
<rect x="985.0" y="60.0" width="205.0" height="70.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="1087.5" y="91.0" text-anchor="middle" font-size="19" font-weight="700" fill="#ea580c">dispatcher</text>
<text x="1087.5" y="112.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">where is each truck?</text>
<line x1="940.0" y1="195.0" x2="985.0" y2="195.0" stroke="#ea580c" stroke-width="2" marker-end="url(#a-c1)"/>
<rect x="985.0" y="160.0" width="205.0" height="70.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="1087.5" y="191.0" text-anchor="middle" font-size="19" font-weight="700" fill="#ea580c">mechanic</text>
<text x="1087.5" y="212.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">which engine faulted?</text>
<line x1="940.0" y1="195.0" x2="985.0" y2="295.0" stroke="#ea580c" stroke-width="2" marker-end="url(#a-c1)"/>
<rect x="985.0" y="260.0" width="205.0" height="70.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="1087.5" y="291.0" text-anchor="middle" font-size="19" font-weight="700" fill="#ea580c">fleet manager</text>
<text x="1087.5" y="312.0" text-anchor="middle" font-size="15" font-weight="400" fill="#0f172a">idling, inspections</text>
<text x="20.0" y="390.0" text-anchor="start" font-size="19" font-weight="700" fill="#0f172a">the ECUs never speak IP: the gateway parses and re-encodes, like your bridge</text>
<text x="20.0" y="418.0" text-anchor="start" font-size="18" font-weight="400" fill="#475569">each alert goes to the role that can act on it</text>
