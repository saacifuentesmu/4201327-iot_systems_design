<rect x="20.0" y="70.0" width="460.0" height="250.0" rx="18" fill="#f8fafc" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/>
<text x="40.0" y="102.0" text-anchor="start" font-size="19" font-weight="700" fill="#475569">vehicle</text>
